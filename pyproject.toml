[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-canonicalization"
version = "0.1.0"
description = "Utilities for transformer parameter serialization and canonicalization"
requires-python = ">=3.10"
dependencies = [
	"python-dotenv>=1.0.0",
	"wandb>=0.25.0",
]

[tool.setuptools]
packages = ["lib"]